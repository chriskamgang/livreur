  <!-- Bottom text -->
  <text x="512" y="710" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600" font-size="40" fill="rgba(255,255,255,0.7)" letter-spacing="4">EXPRESS</text>
</svg>
